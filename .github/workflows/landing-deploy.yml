name: Landing — Build & Deploy (Azure SWA)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      contents: read
      pull-requests: write
    env:
      # SAP-166: prod indexable; preview/PR builds noindex.
      NEXT_PUBLIC_SEARCH_INDEX: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (static export)
        run: pnpm build

      - name: Verify static export output
        run: |
          test -f out/index.html
          test -d out/pt-BR
          echo "Static export OK ($(find out -type f | wc -l | tr -d ' ') files)"

      - name: Deploy to Azure Static Web Apps
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING != '' }}
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'out'
          output_location: 'out'
          skip_app_build: true
          skip_api_build: true
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}

      - name: Note — deploy skipped (no SWA token yet)
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING == '' }}
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}
        run: |
          echo "::notice title=Deploy skipped::AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING secret not set."
          echo "::notice::Build succeeded. CTO/CEO must provision the Azure SWA resource and add the secret to enable deploys (see README)."

  close_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Preview
    steps:
      - name: Close PR preview environment
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}
          action: close
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LANDING }}
